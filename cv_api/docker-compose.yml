version: "3.9"

# The dashboard starts analytics jobs when an operator selects a source.
# The standalone analytics service is opt-in for CLI-only deployments.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  analytics:
    profiles: ["standalone-pipeline"]
    build: .
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - ./config:/app/config:ro
      - ./evidence:/app/evidence
    command: ["python", "-m", "src.analytics.pipeline", "--config", "config/pipeline.yaml"]
    restart: unless-stopped

  dashboard:
    build: .
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: analytics/events
      EVIDENCE_DIR: /app/evidence
    volumes:
      - ./evidence:/app/evidence
      - ./runtime-jobs:/app/runtime-jobs
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.dashboard.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # React + TypeScript dashboard UI (frontend/). Multi-stage build: Vite
  # compiles the static bundle, nginx serves it and reverse-proxies
  # /events, /health, and /ws/ to `dashboard` (see frontend/nginx.conf) so
  # the browser only ever talks to one origin. Served on 5173 so it never
  # collides with the existing plain-HTML dashboard on 8000.
  dashboard-ui:
    build: ../frontend
    depends_on:
      - dashboard
    ports:
      - "5173:80"
    restart: unless-stopped
